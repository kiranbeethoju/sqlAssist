name: Build Windows EXE

on:
  workflow_dispatch:  # Allows manual triggering
  push:
    branches: [ main ]
    paths:
      - 'csv_operations.py'
      - 'kblogo.png'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Build app (onedir — faster startup)
      run: |
        pyinstaller `
          --onedir `
          --noconsole `
          --name "CSVOperations" `
          --add-data "kblogo.png;." `
          csv_operations.py

    - name: Upload app folder as artifact
      uses: actions/upload-artifact@v4
      with:
        name: CSVOperations-Windows
        path: dist/CSVOperations/
        retention-days: 30
